<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book an appointment</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #f6f3ee; color: #2a261f; font: 17px/1.45 Palatino, "Palatino Linotype", Georgia, serif; }
    main { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    header { text-align: center; }
    .mark { width: 210px; height: auto; display: block; margin: 0 auto 0.25rem; }
    h1 { font-weight: normal; font-size: 2rem; line-height: 1.15; margin: 0.15rem 0; letter-spacing: 0.01em; }
    .eyebrow, #contact { margin: 0; color: #6d6458; font: 0.82rem/1.4 "Segoe UI", sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
    #contact { letter-spacing: 0.02em; text-transform: none; margin-top: 0.35rem; }
    form { display: grid; gap: 1rem; margin-top: 1.6rem; }
    label { display: grid; gap: 0.35rem; font: 0.78rem/1.3 "Segoe UI", sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: #6d6458; }
    select, input { font: 1rem/1.3 "Segoe UI", sans-serif; letter-spacing: 0; text-transform: none; color: #2a261f; padding: 0.7rem 0.75rem; border: 1px solid #ddd4c8; border-radius: 10px; background: #fff; }
    .days { display: flex; gap: 0.45rem; overflow-x: auto; padding: 0.15rem 0.05rem 0.45rem; scroll-snap-type: x proximity; }
    .days button { flex: 0 0 auto; width: 3.6rem; scroll-snap-align: start; border: 1px solid #ddd4c8; background: #fff; color: #3e4a34; border-radius: 12px; padding: 0.45rem 0.2rem 0.5rem; font: 0.72rem/1.2 "Segoe UI", sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
    .days button strong { display: block; font: 1.15rem/1.2 Palatino, Georgia, serif; letter-spacing: 0; text-transform: none; }
    .days button[aria-checked="true"] { background: #3e4a34; color: #f6f3ee; border-color: #3e4a34; }
    #times h2 { font: 1.05rem/1.3 Palatino, Georgia, serif; font-weight: normal; margin: 0.2rem 0 0.55rem; }
    .times { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .times button, form > button { border: 1px solid #3e4a34; background: #fff; color: #3e4a34; border-radius: 999px; padding: 0.45rem 0.8rem; font: 0.95rem/1.2 "Segoe UI", sans-serif; }
    .times button[aria-pressed="true"], form > button { background: #3e4a34; color: #f6f3ee; }
    form > button { justify-self: start; padding: 0.75rem 1.4rem; }
    form > button:disabled { opacity: 0.4; }
    #notice { min-height: 1.4em; margin: 0; }
  </style>
</head>

      <p class="eyebrow">Austin, Texas</p>
      <h1 id="business-name">Book an appointment</h1>
      <p id="contact"></p>
    </header>
    <form id="booking-form">
      <label>Service
        <select id="service"></select>
      </label>
      <div id="days" class="days" role="radiogroup" aria-label="Day"></div>
      <div id="times"></div>
      <label>Name
        <input id="customer-name" name="customer_name" autocomplete="name" required>
      </label>
      <label>Email
        <input id="customer-email" name="customer_email" type="email" autocomplete="email" required>
      </label>
      <label>Phone, if you like
        <input id="customer-phone" name="customer_phone" type="tel" autocomplete="tel">
      </label>
      <button id="book" type="submit" disabled>Book</button>
      <p id="notice" role="status"></p>
    </form>
  </main>
  <script>
    var selected = null;
    var selectedDay = "";
    var days = [];
    var serviceBox = document.getElementById("service");
    var dayBox = document.getElementById("days");
    var timesBox = document.getElementById("times");
    var notice = document.getElementById("notice");
    var bookButton = document.getElementById("book");

    google.script.run.withSuccessHandler(showCatalog).withFailureHandler(showFailure).getCatalog();
    serviceBox.addEventListener("change", loadSlots);
    document.getElementById("booking-form").addEventListener("submit", submit);

    function showCatalog(catalog) {
      document.getElementById("business-name").textContent = catalog.businessName;
      document.getElementById("contact").textContent = catalog.address + " · " + catalog.phone;
      serviceBox.innerHTML = "";
      catalog.services.forEach(function (service) {
        var option = document.createElement("option");
        option.value = service.service_id;
        option.textContent = service.name + " · $" + service.price_usd + " · " + service.duration_minutes + " min";
        serviceBox.appendChild(option);
      });
      loadSlots();
    }

    function loadSlots() {
      selected = null;
      bookButton.disabled = true;
      timesBox.textContent = "Loading open times…";
      google.script.run.withSuccessHandler(showSlots).withFailureHandler(showFailure).getOpenSlots(serviceBox.value);
    }

    function showSlots(slots) {
      var groups = {};
      var order = [];
      slots.forEach(function (slot) {
        if (!groups[slot.date]) {
          groups[slot.date] = [];
          order.push(slot.date);
        }
        groups[slot.date].push(slot);
      });
      days = order.map(function (date) { return { date: date, slots: groups[date] }; });
      if (!days.length) {
        dayBox.innerHTML = "";
        timesBox.textContent = "No open times for this service.";
        return;
      }
      var keep = days.some(function (day) { return day.date === selectedDay; });
      renderDay(keep ? selectedDay : days[0].date);
    }

    function renderDay(date) {
      selected = null;
      bookButton.disabled = true;
      selectedDay = date;
      dayBox.innerHTML = "";
      days.forEach(function (day) {
        var button = document.createElement("button");
        var parts = dayParts(day.date);
        button.type = "button";
        button.setAttribute("role", "radio");
        button.setAttribute("aria-checked", day.date === date ? "true" : "false");
        button.innerHTML = parts.weekday + "<strong>" + parts.day + "</strong>";
        button.addEventListener("click", function () { renderDay(day.date); });
        dayBox.appendChild(button);
      });
      var chosen = days.filter(function (day) { return day.date === date; })[0];
      var active = dayBox.querySelector('[aria-checked="true"]');
      if (active && active.scrollIntoView) active.scrollIntoView({ inline: "center", block: "nearest" });
      timesBox.innerHTML = "";
      var heading = document.createElement("h2");
      heading.textContent = showDate(date);
      timesBox.appendChild(heading);
      var row = document.createElement("div");
      row.className = "times";
      chosen.slots.forEach(function (slot) {
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = slot.start_time;
        button.setAttribute("aria-pressed", "false");
        button.addEventListener("click", function () {
          selected = slot;
          Array.prototype.forEach.call(row.querySelectorAll("button"), function (other) {
            other.setAttribute("aria-pressed", other === button ? "true" : "false");
          });
          bookButton.disabled = false;
        });
        row.appendChild(button);
      });
      timesBox.appendChild(row);
    }

    function submit(event) {
      event.preventDefault();
      if (!selected) return;
      bookButton.disabled = true;
      notice.textContent = "Booking…";
      google.script.run.withSuccessHandler(showResult).withFailureHandler(showFailure).submitBooking({
        service_id: serviceBox.value,
        date: selected.date,
        start_time: selected.start_time,
        customer_name: document.getElementById("customer-name").value,
        customer_email: document.getElementById("customer-email").value,
        customer_phone: document.getElementById("customer-phone").value
      });
    }

    function showResult(result) {
      notice.textContent = result.message;
      if (result.ok) {
        document.getElementById("customer-name").value = "";
        document.getElementById("customer-email").value = "";
        document.getElementById("customer-phone").value = "";
        loadSlots();
        return;
      }
      bookButton.disabled = !selected;
    }

    function showFailure(error) {
      notice.textContent = error && error.message ? error.message : "Something went wrong. Please try again.";
      bookButton.disabled = !selected;
    }

    function dayParts(iso) {
      var parts = iso.split("-").map(Number);
      var date = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
      return {
        weekday: date.toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" }),
        day: String(parts[2])
      };
    }

    function showDate(iso) {
      var parts = iso.split("-").map(Number);
      return new Date(Date.UTC(parts[0], parts[1] - 1, parts[2])).toLocaleDateString("en-US", {
        weekday: "long", month: "long", day: "numeric", timeZone: "UTC"
      });
    }
  </script>
</body>
</html>
